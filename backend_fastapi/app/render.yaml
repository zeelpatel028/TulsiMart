services:
  - type: web
    name: tulsi-mart-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_URL
        sync: false
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        value: tulsi-mart-08-zeelptl028-e556.e.aivencloud.com
      - key: DB_PORT
        value: "18925"
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://tulsi-mart.vercel.app,http://localhost:5173
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
