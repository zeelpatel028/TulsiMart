name: Render Keep-Alive Auto-Ping

on:
  schedule:
    # Runs every 3 minutes automatically
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Service
        run: |
          curl -s -X GET "${{ secrets.RENDER_BACKEND_URL || 'https://tulsi-mart-backend.onrender.com/health' }}" -m 15 || true

