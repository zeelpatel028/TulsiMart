name: Render Keep-Alive Auto-Ping

on:
  schedule:
    # Runs every 5 minutes automatically
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Service
        run: |
          curl -s -X GET "https://tulsi-mart-backend.onrender.com/api/health/light" -m 15 || true
